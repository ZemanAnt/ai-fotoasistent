name: Build Android APK from ZIP

on:
  push:
    branches:
      - main
    paths:
      - "AI-FotoAsistent-source.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-foto-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ZIP: AI-FotoAsistent-source.zip
  PROJECT_DIR: extracted-project

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP"
          unzip -t "$SOURCE_ZIP"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"
          unzip -q "$SOURCE_ZIP" -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew scripts/verify-repository.sh
          ./scripts/verify-repository.sh
          ./gradlew --version

      - name: Lint, test and build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace \
            lintDebug \
            testDebugUnitTest \
            assembleDebug

      - name: Prepare downloadable APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          OUTPUT_DIR="$RUNNER_TEMP/ai-foto-output"
          OUTPUT_APK="$OUTPUT_DIR/AI-FotoAsistent-v0.9.0-debug.apk"
          OUTPUT_SHA="$OUTPUT_DIR/AI-FotoAsistent-v0.9.0-debug.sha256"

          test -f "$SOURCE_APK"
          mkdir -p "$OUTPUT_DIR"
          cp "$SOURCE_APK" "$OUTPUT_APK"
          (
            cd "$OUTPUT_DIR"
            sha256sum "$(basename "$OUTPUT_APK")" > "$(basename "$OUTPUT_SHA")"
          )

          echo "directory=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: AI-FotoAsistent-debug
          path: |
            ${{ steps.package.outputs.directory }}/AI-FotoAsistent-v0.9.0-debug.apk
            ${{ steps.package.outputs.directory }}/AI-FotoAsistent-v0.9.0-debug.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports when build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: AI-FotoAsistent-build-reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/
            ${{ env.PROJECT_DIR }}/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
