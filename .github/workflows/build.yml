name: Build Android APK from ZIP

on:
  push:
    branches: [main]
    paths:
      - "AI-FotoAsistent-source.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-foto-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ZIP: AI-FotoAsistent-source.zip
  PROJECT_DIR: extracted-project

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract and patch project
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP"
          unzip -t "$SOURCE_ZIP"
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"
          unzip -q "$SOURCE_ZIP" -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/gradlew"

          # Kompatibilitní opravy zdrojového ZIPu v0.9.0.
          python3 - <<'PY'
          from pathlib import Path

          root = Path("extracted-project/app/src/main/java")
          analyzer = root / "cz/hqsnet/aifoto/analysis/SceneAnalyzer.kt"
          text = analyzer.read_text(encoding="utf-8")
          replacements = {
              "face.leftEyeOpenProbability.takeIf { it >= 0f }":
                  "face.leftEyeOpenProbability?.takeIf { it >= 0f }",
              "face.rightEyeOpenProbability.takeIf { it >= 0f }":
                  "face.rightEyeOpenProbability?.takeIf { it >= 0f }",
              "face.smilingProbability.takeIf { it >= 0f }":
                  "face.smilingProbability?.takeIf { it >= 0f }",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          analyzer.write_text(text, encoding="utf-8")

          # CameraX používá AndroidX opt-in anotace, nikoli Kotlin RequiresOptIn.
          for path in root.rglob("*.kt"):
              text = path.read_text(encoding="utf-8")
              text = text.replace(
                  "@OptIn(ExperimentalCamera2Interop::class)",
                  "@androidx.annotation.OptIn(ExperimentalCamera2Interop::class)",
              )
              text = text.replace(
                  "@OptIn(ExperimentalGetImage::class)",
                  "@androidx.annotation.OptIn(ExperimentalGetImage::class)",
              )
              path.write_text(text, encoding="utf-8")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew scripts/verify-repository.sh
          ./scripts/verify-repository.sh
          ./gradlew --version

      - name: Assemble debug APK
        id: assemble
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug \
            2>&1 | tee "$RUNNER_TEMP/assemble.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run unit tests
        id: tests
        if: steps.assemble.outputs.status == '0'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest \
            2>&1 | tee "$RUNNER_TEMP/tests.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run Android lint
        id: lint
        if: steps.assemble.outputs.status == '0'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --console=plain :app:lintDebug \
            2>&1 | tee "$RUNNER_TEMP/lint.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare APK
        id: package
        if: steps.assemble.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/ai-foto-output"
          mkdir -p "$output"
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
             "$output/AI-FotoAsistent-v0.9.0-debug.apk"
          cd "$output"
          sha256sum AI-FotoAsistent-v0.9.0-debug.apk > AI-FotoAsistent-v0.9.0-debug.sha256
          echo "directory=$output" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        if: steps.assemble.outputs.status == '0'
        uses: actions/upload-artifact@v7
        with:
          name: AI-FotoAsistent-debug
          path: |
            ${{ steps.package.outputs.directory }}/AI-FotoAsistent-v0.9.0-debug.apk
            ${{ steps.package.outputs.directory }}/AI-FotoAsistent-v0.9.0-debug.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Create readable build status
        if: always()
        shell: bash
        env:
          ASSEMBLE_STATUS: ${{ steps.assemble.outputs.status }}
          TEST_STATUS: ${{ steps.tests.outputs.status }}
          LINT_STATUS: ${{ steps.lint.outputs.status }}
        run: |
          set -euo pipefail
          {
            echo "# Poslední výsledek sestavení"
            echo
            echo "- GitHub run: $GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo "- Assemble APK: ${ASSEMBLE_STATUS:-neprovedeno}"
            echo "- Unit testy: ${TEST_STATUS:-neprovedeno}"
            echo "- Android lint: ${LINT_STATUS:-neprovedeno}"
            echo
            echo "## Důležité řádky"
            echo
            echo '```text'
            for log in "$RUNNER_TEMP/assemble.log" "$RUNNER_TEMP/tests.log" "$RUNNER_TEMP/lint.log"; do
              grep -E "(^e: |^w: |FAILURE:|BUILD FAILED|BUILD SUCCESSFUL|FAILED$|error:)" \
                "$log" 2>/dev/null | tail -n 100 || true
            done
            echo '```'
          } > BUILD_STATUS.md

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AI-FotoAsistent-build-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/assemble.log
            ${{ runner.temp }}/tests.log
            ${{ runner.temp }}/lint.log
            BUILD_STATUS.md
            ${{ env.PROJECT_DIR }}/app/build/reports/
            ${{ env.PROJECT_DIR }}/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish build status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Update Android build diagnostics [skip ci]"
            git push
          fi

      - name: Final result
        if: always()
        shell: bash
        env:
          ASSEMBLE_STATUS: ${{ steps.assemble.outputs.status }}
          TEST_STATUS: ${{ steps.tests.outputs.status }}
          LINT_STATUS: ${{ steps.lint.outputs.status }}
        run: |
          if [ "${ASSEMBLE_STATUS:-1}" != "0" ]; then
            echo "APK se nepodařilo zkompilovat. Viz BUILD_STATUS.md."
            exit 1
          fi
          if [ "${TEST_STATUS:-1}" != "0" ]; then
            echo "Unit testy selhaly. Viz BUILD_STATUS.md."
            exit 1
          fi
          if [ "${LINT_STATUS:-1}" != "0" ]; then
            echo "Android lint selhal. Viz BUILD_STATUS.md."
            exit 1
          fi
          echo "APK, unit testy i Android lint prošly úspěšně."
