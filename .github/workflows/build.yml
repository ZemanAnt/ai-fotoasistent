name: Build Android APK from ZIP

on:
  push:
    branches: [main]
    paths:
      - "AI-FotoAsistent-source.zip"
      - ".github/workflows/build.yml"
      - ".github/patches/v091/**"
      - ".github/patches/v092/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-foto-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ZIP: AI-FotoAsistent-source.zip
  PROJECT_DIR: extracted-project

jobs:
  build:
    name: Build debug APK v0.9.2
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract and apply v0.9.1 + v0.9.2
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP"
          unzip -t "$SOURCE_ZIP"
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"
          unzip -q "$SOURCE_ZIP" -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/gradlew"

          # Kompatibilitní opravy původního ZIPu v0.9.0.
          python3 - <<'PYFIX'
          from pathlib import Path
          root = Path("extracted-project/app/src/main/java")
          analyzer = root / "cz/hqsnet/aifoto/analysis/SceneAnalyzer.kt"
          text = analyzer.read_text(encoding="utf-8")
          text = text.replace(
              "face.leftEyeOpenProbability.takeIf { it >= 0f }",
              "face.leftEyeOpenProbability?.takeIf { it >= 0f }",
          ).replace(
              "face.rightEyeOpenProbability.takeIf { it >= 0f }",
              "face.rightEyeOpenProbability?.takeIf { it >= 0f }",
          ).replace(
              "face.smilingProbability.takeIf { it >= 0f }",
              "face.smilingProbability?.takeIf { it >= 0f }",
          )
          analyzer.write_text(text, encoding="utf-8")
          for path in root.rglob("*.kt"):
              text = path.read_text(encoding="utf-8")
              text = text.replace(
                  "@OptIn(ExperimentalCamera2Interop::class)",
                  "@androidx.annotation.OptIn(ExperimentalCamera2Interop::class)",
              ).replace(
                  "@OptIn(ExperimentalGetImage::class)",
                  "@androidx.annotation.OptIn(ExperimentalGetImage::class)",
              )
              path.write_text(text, encoding="utf-8")
          PYFIX

          apply_patch() {
            local version="$1"
            local output="$RUNNER_TEMP/${version}.patch"
            cat ".github/patches/${version}/"part-* | base64 -d | gzip -d > "$output"
            (
              cd "$PROJECT_DIR"
              git init -q
              if [ "$version" = "v092" ]; then
                # README a CHANGELOG se v lokálním v0.9.1 balíku lišily jen
                # dokumentačně. Kódový patch je proto aplikuje nezávisle.
                git apply --check --exclude=README.md --exclude=CHANGELOG.md "$output"
                git apply --exclude=README.md --exclude=CHANGELOG.md "$output"
              else
                git apply --check "$output"
                git apply "$output"
              fi
            )
          }

          apply_patch v091
          apply_patch v092

          python3 - <<'PYDOC'
          from pathlib import Path
          root = Path("extracted-project")
          readme = root / "README.md"
          text = readme.read_text(encoding="utf-8")
          text = text.replace("v0.9.1", "v0.9.2").replace("Verze 0.9.1", "Verze 0.9.2")
          readme.write_text(text, encoding="utf-8")

          changelog = root / "CHANGELOG.md"
          text = changelog.read_text(encoding="utf-8")
          if "## 0.9.2" not in text:
              text = "# Changelog\n\n## 0.9.2 – Night Calibration Fix\n\n- automatický profil Noční interiér pro tmavé statické scény,\n- lokální tone mapping se zachováním skutečné černé,\n- silnější odšumění před zesvětlením,\n- přísnější RETAKE při vysokém ISO a hlubokých stínech,\n- porovnání originálu a AI kopie a JPEG kvalita 95.\n\n" + text.removeprefix("# Changelog\n\n")
          changelog.write_text(text, encoding="utf-8")
          PYDOC

          grep -q 'versionName = "0.9.2"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'NightCaptureMode.INTERIOR' \
            "$PROJECT_DIR/app/src/main/java/cz/hqsnet/aifoto/capture/NightPlanner.kt"
          grep -q 'HIGH_ISO_SHADOW_LIFT' \
            "$PROJECT_DIR/app/src/main/java/cz/hqsnet/aifoto/calibration/FieldCalibration.kt"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew scripts/verify-repository.sh
          ./scripts/verify-repository.sh
          ./gradlew --version

      - name: Assemble debug APK
        id: assemble
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug \
            2>&1 | tee "$RUNNER_TEMP/assemble.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run unit tests
        id: tests
        if: steps.assemble.outputs.status == '0'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest \
            2>&1 | tee "$RUNNER_TEMP/tests.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run Android lint
        id: lint
        if: steps.assemble.outputs.status == '0'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --console=plain :app:lintDebug \
            2>&1 | tee "$RUNNER_TEMP/lint.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare APK
        id: package
        if: steps.assemble.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/ai-foto-output"
          mkdir -p "$output"
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
             "$output/AI-FotoAsistent-v0.9.2-debug.apk"
          cd "$output"
          sha256sum AI-FotoAsistent-v0.9.2-debug.apk > AI-FotoAsistent-v0.9.2-debug.sha256
          echo "directory=$output" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        if: steps.assemble.outputs.status == '0'
        uses: actions/upload-artifact@v7
        with:
          name: AI-FotoAsistent-v0.9.2-debug
          path: |
            ${{ steps.package.outputs.directory }}/AI-FotoAsistent-v0.9.2-debug.apk
            ${{ steps.package.outputs.directory }}/AI-FotoAsistent-v0.9.2-debug.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Create readable build status
        if: always()
        shell: bash
        env:
          ASSEMBLE_STATUS: ${{ steps.assemble.outputs.status }}
          TEST_STATUS: ${{ steps.tests.outputs.status }}
          LINT_STATUS: ${{ steps.lint.outputs.status }}
        run: |
          set -euo pipefail
          {
            echo "# Poslední výsledek sestavení v0.9.2"
            echo
            echo "- GitHub run: $GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo "- Assemble APK: ${ASSEMBLE_STATUS:-neprovedeno}"
            echo "- Unit testy: ${TEST_STATUS:-neprovedeno}"
            echo "- Android lint: ${LINT_STATUS:-neprovedeno}"
            echo
            echo "## Důležité řádky"
            echo
            echo '```text'
            for log in "$RUNNER_TEMP/assemble.log" "$RUNNER_TEMP/tests.log" "$RUNNER_TEMP/lint.log"; do
              grep -E "(^e: |^w: |FAILURE:|BUILD FAILED|BUILD SUCCESSFUL|FAILED$|error:)" \
                "$log" 2>/dev/null | tail -n 140 || true
            done
            echo '```'
          } > BUILD_STATUS.md

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AI-FotoAsistent-v0.9.2-build-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/assemble.log
            ${{ runner.temp }}/tests.log
            ${{ runner.temp }}/lint.log
            BUILD_STATUS.md
            ${{ env.PROJECT_DIR }}/app/build/reports/
            ${{ env.PROJECT_DIR }}/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish build status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Update v0.9.2 build diagnostics [skip ci]"
            git push
          fi

      - name: Final result
        if: always()
        shell: bash
        env:
          ASSEMBLE_STATUS: ${{ steps.assemble.outputs.status }}
          TEST_STATUS: ${{ steps.tests.outputs.status }}
          LINT_STATUS: ${{ steps.lint.outputs.status }}
        run: |
          test "${ASSEMBLE_STATUS:-1}" = "0" || { echo "APK se nepodařilo zkompilovat."; exit 1; }
          test "${TEST_STATUS:-1}" = "0" || { echo "Unit testy selhaly."; exit 1; }
          test "${LINT_STATUS:-1}" = "0" || { echo "Android lint selhal."; exit 1; }
          echo "v0.9.2: APK, unit testy i Android lint prošly úspěšně."
