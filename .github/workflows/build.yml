name: Build Android APK from ZIP

on:
  push:
    branches:
      - main
    paths:
      - "AI-FotoAsistent-source.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-foto-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ZIP: AI-FotoAsistent-source.zip
  PROJECT_DIR: extracted-project

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP"
          unzip -t "$SOURCE_ZIP"
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"
          unzip -q "$SOURCE_ZIP" -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew scripts/verify-repository.sh
          ./scripts/verify-repository.sh
          ./gradlew --version

      # APK se sestavuje jako první. Lint nebo testy už nemohou zabránit
      # vytvoření instalačního souboru, pokud je samotná aplikace kompilovatelná.
      - name: Assemble debug APK
        id: assemble
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug \
            2>&1 | tee "$RUNNER_TEMP/assemble.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run unit tests
        id: tests
        if: steps.assemble.outputs.status == '0'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace :app:testDebugUnitTest \
            2>&1 | tee "$RUNNER_TEMP/tests.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run Android lint
        id: lint
        if: steps.assemble.outputs.status == '0'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace :app:lintDebug \
            2>&1 | tee "$RUNNER_TEMP/lint.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare downloadable APK
        id: package
        if: steps.assemble.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          OUTPUT_DIR="$RUNNER_TEMP/ai-foto-output"
          OUTPUT_APK="$OUTPUT_DIR/AI-FotoAsistent-v0.9.0-debug.apk"
          OUTPUT_SHA="$OUTPUT_DIR/AI-FotoAsistent-v0.9.0-debug.sha256"

          test -f "$SOURCE_APK"
          mkdir -p "$OUTPUT_DIR"
          cp "$SOURCE_APK" "$OUTPUT_APK"
          (
            cd "$OUTPUT_DIR"
            sha256sum "$(basename "$OUTPUT_APK")" > "$(basename "$OUTPUT_SHA")"
          )
          echo "directory=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        if: steps.assemble.outputs.status == '0'
        uses: actions/upload-artifact@v7
        with:
          name: AI-FotoAsistent-debug
          path: |
            ${{ steps.package.outputs.directory }}/AI-FotoAsistent-v0.9.0-debug.apk
            ${{ steps.package.outputs.directory }}/AI-FotoAsistent-v0.9.0-debug.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Create readable diagnostics
        if: always()
        shell: bash
        env:
          ASSEMBLE_STATUS: ${{ steps.assemble.outputs.status }}
          TEST_STATUS: ${{ steps.tests.outputs.status }}
          LINT_STATUS: ${{ steps.lint.outputs.status }}
        run: |
          set -euo pipefail
          DIAG_DIR="$RUNNER_TEMP/ai-foto-diagnostics"
          mkdir -p "$DIAG_DIR"
          cp "$RUNNER_TEMP/assemble.log" "$DIAG_DIR/assemble.log" 2>/dev/null || true
          cp "$RUNNER_TEMP/tests.log" "$DIAG_DIR/tests.log" 2>/dev/null || true
          cp "$RUNNER_TEMP/lint.log" "$DIAG_DIR/lint.log" 2>/dev/null || true
          cp -R "$PROJECT_DIR/app/build/reports" "$DIAG_DIR/reports" 2>/dev/null || true
          cp -R "$PROJECT_DIR/app/build/test-results" "$DIAG_DIR/test-results" 2>/dev/null || true

          {
            echo "# Poslední výsledek sestavení"
            echo
            echo "- GitHub run: $GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo "- Assemble APK: ${ASSEMBLE_STATUS:-neprovedeno}"
            echo "- Unit testy: ${TEST_STATUS:-neprovedeno}"
            echo "- Android lint: ${LINT_STATUS:-neprovedeno}"
            echo
            echo "## Konec protokolu assembleDebug"
            echo
            echo '```text'
            tail -n 180 "$RUNNER_TEMP/assemble.log" 2>/dev/null || echo "Protokol nebyl vytvořen."
            echo '```'
            if [ -f "$RUNNER_TEMP/tests.log" ] && [ "${TEST_STATUS:-0}" != "0" ]; then
              echo
              echo "## Konec protokolu unit testů"
              echo
              echo '```text'
              tail -n 120 "$RUNNER_TEMP/tests.log"
              echo '```'
            fi
            if [ -f "$RUNNER_TEMP/lint.log" ] && [ "${LINT_STATUS:-0}" != "0" ]; then
              echo
              echo "## Konec protokolu Android lint"
              echo
              echo '```text'
              tail -n 120 "$RUNNER_TEMP/lint.log"
              echo '```'
            fi
          } > BUILD_STATUS.md

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AI-FotoAsistent-build-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/ai-foto-diagnostics/
            BUILD_STATUS.md
          if-no-files-found: warn
          retention-days: 14

      # Soubor se zapíše do repozitáře, aby byla první skutečná chyba čitelná
      # i z telefonu bez hledání ve stovkách řádků Actions logu. Změna tohoto
      # souboru nespouští další build díky filtru paths výše.
      - name: Publish build status to repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_STATUS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Android build diagnostics [skip ci]"
          git push

      - name: Final build result
        if: always()
        shell: bash
        env:
          ASSEMBLE_STATUS: ${{ steps.assemble.outputs.status }}
          TEST_STATUS: ${{ steps.tests.outputs.status }}
          LINT_STATUS: ${{ steps.lint.outputs.status }}
        run: |
          if [ "${ASSEMBLE_STATUS:-1}" != "0" ]; then
            echo "APK se nepodařilo zkompilovat. Podrobnosti jsou v BUILD_STATUS.md."
            exit 1
          fi
          if [ "${TEST_STATUS:-0}" != "0" ]; then
            echo "::warning::APK vzniklo, ale některé unit testy selhaly."
          fi
          if [ "${LINT_STATUS:-0}" != "0" ]; then
            echo "::warning::APK vzniklo, ale Android lint našel chyby."
          fi
          echo "APK bylo úspěšně vytvořeno a nahráno do Artifacts."
