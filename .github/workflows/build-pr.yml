name: Validate Android v0.9.5

on:
  pull_request:
    branches: [main]
    paths:
      - "AI-FotoAsistent-source.zip"
      - ".github/workflows/build-pr.yml"
      - ".github/patches/v091/**"
      - ".github/patches/v092/**"
      - ".github/patches/v092fix/**"
      - ".github/patches/v093/**"
      - ".github/patches/v093fix/**"
      - ".github/patches/v094/**"
      - ".github/patches/v094fix/**"
      - ".github/patches/v095/**"
      - ".github/validation/v095/**"

permissions:
  contents: read

concurrency:
  group: ai-foto-v095-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_ZIP: AI-FotoAsistent-source.zip
  PROJECT_DIR: extracted-project

jobs:
  validate:
    name: Build, test and lint v0.9.5
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract base source
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$SOURCE_ZIP"
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"
          unzip -q "$SOURCE_ZIP" -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/gradlew"

      - name: Apply v0.9.0 compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX'
          from pathlib import Path
          root = Path("extracted-project/app/src/main/java")
          analyzer = root / "cz/hqsnet/aifoto/analysis/SceneAnalyzer.kt"
          text = analyzer.read_text(encoding="utf-8")
          text = text.replace("face.leftEyeOpenProbability.takeIf { it >= 0f }", "face.leftEyeOpenProbability?.takeIf { it >= 0f }")
          text = text.replace("face.rightEyeOpenProbability.takeIf { it >= 0f }", "face.rightEyeOpenProbability?.takeIf { it >= 0f }")
          text = text.replace("face.smilingProbability.takeIf { it >= 0f }", "face.smilingProbability?.takeIf { it >= 0f }")
          analyzer.write_text(text, encoding="utf-8")
          for path in root.rglob("*.kt"):
              text = path.read_text(encoding="utf-8")
              text = text.replace("@OptIn(ExperimentalCamera2Interop::class)", "@androidx.annotation.OptIn(ExperimentalCamera2Interop::class)")
              text = text.replace("@OptIn(ExperimentalGetImage::class)", "@androidx.annotation.OptIn(ExperimentalGetImage::class)")
              path.write_text(text, encoding="utf-8")
          PYFIX

      - name: Reconstruct and apply patches
        shell: bash
        run: |
          set -euo pipefail
          decode_patch() {
            local version="$1"
            cat ".github/patches/${version}/"part-* | base64 -d | gzip -d > "$RUNNER_TEMP/${version}.patch"
          }
          decode_patch v091
          decode_patch v092
          decode_patch v092fix
          decode_patch v093
          decode_patch v093fix

          cat .github/patches/v094fix/part-* .github/patches/v094/part-01 .github/patches/v094/part-02 > "$RUNNER_TEMP/v094.b64"
          echo "f2c2cb65c262a82defb8534d35a75ad72a26d22de2cc6171c22d2d3bffe76779  $RUNNER_TEMP/v094.b64" | sha256sum -c -
          base64 -d "$RUNNER_TEMP/v094.b64" | gzip -d > "$RUNNER_TEMP/v094.patch"
          echo "25a360bee6c8f47bc8e3761f6c0f5148773b097022605c18ce8cd15315ae6369  $RUNNER_TEMP/v094.patch" | sha256sum -c -

          cat .github/patches/v095/part-* > "$RUNNER_TEMP/v095.b64"
          echo "a88c1b3feee0372e4b3f77c504f537597e86c4ecf444ef8e5029f5039c1d88c9  $RUNNER_TEMP/v095.b64" | sha256sum -c -
          base64 -d "$RUNNER_TEMP/v095.b64" | gzip -d > "$RUNNER_TEMP/v095.patch"
          echo "f86537899ff108e7a8093ef0735a03c732d51805fe533948a342ef76f6dbb27f  $RUNNER_TEMP/v095.patch" | sha256sum -c -

          cd "$PROJECT_DIR"
          git init -q
          git apply --check "$RUNNER_TEMP/v091.patch"
          git apply "$RUNNER_TEMP/v091.patch"
          git apply --check --exclude=README.md --exclude=CHANGELOG.md "$RUNNER_TEMP/v092.patch"
          git apply --exclude=README.md --exclude=CHANGELOG.md "$RUNNER_TEMP/v092.patch"
          git apply --check "$RUNNER_TEMP/v092fix.patch"
          git apply "$RUNNER_TEMP/v092fix.patch"
          git apply --check --exclude=README.md --exclude=CHANGELOG.md "$RUNNER_TEMP/v093.patch"
          git apply --exclude=README.md --exclude=CHANGELOG.md "$RUNNER_TEMP/v093.patch"
          git apply --check "$RUNNER_TEMP/v093fix.patch"
          git apply "$RUNNER_TEMP/v093fix.patch"
          git apply --check --exclude=README.md --exclude=README.en.md --exclude=CHANGELOG.md --exclude='docs/**' "$RUNNER_TEMP/v094.patch"
          git apply --exclude=README.md --exclude=README.en.md --exclude=CHANGELOG.md --exclude='docs/**' "$RUNNER_TEMP/v094.patch"
          git apply --check --exclude=README.md --exclude=README.en.md --exclude=CHANGELOG.md --exclude='docs/**' "$RUNNER_TEMP/v095.patch"
          git apply --exclude=README.md --exclude=README.en.md --exclude=CHANGELOG.md --exclude='docs/**' "$RUNNER_TEMP/v095.patch"

          grep -q 'versionName = "0.9.5"' app/build.gradle.kts
          grep -q 'LongExposureStrategy' app/src/main/java/cz/hqsnet/aifoto/capture/LongExposureModels.kt
          grep -q 'object LongExposureAdvisor' app/src/main/java/cz/hqsnet/aifoto/capture/LongExposureAdvisor.kt
          grep -q 'THERMAL_STATUS_SEVERE' app/src/main/java/cz/hqsnet/aifoto/CameraViewModel.kt
          test -f app/src/test/java/cz/hqsnet/aifoto/capture/LongExposurePlannerTest.kt
          test -f app/src/test/java/cz/hqsnet/aifoto/capture/LongExposureAdvisorTest.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify repository
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew scripts/verify-repository.sh
          ./scripts/verify-repository.sh
          ./gradlew --version

      - name: Assemble debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest

      - name: Run Android lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon --console=plain :app:lintDebug

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p release-output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" release-output/AI-FotoAsistent-v0.9.5-debug.apk
          cd release-output
          sha256sum AI-FotoAsistent-v0.9.5-debug.apk > AI-FotoAsistent-v0.9.5-debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: AI-FotoAsistent-v0.9.5-debug
          path: release-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: AI-FotoAsistent-v0.9.5-pr-diagnostics
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/
            ${{ env.PROJECT_DIR }}/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
